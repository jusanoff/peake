<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Line Panel - Peake Fruit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --s:#2e7d32; --bg:#f4f7f6; --dark:#333; --w:#ff9800; --p:#d32f2f; }
        body{font-family:sans-serif; background:var(--bg); margin:0; padding:10px; display:grid; grid-template-columns: 1fr 340px; gap:15px}
        .card{background:#fff; padding:15px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1); border-top:5px solid var(--s); margin-bottom:15px}
        h3{margin-top:0; color:var(--dark); border-bottom:1px solid #eee; padding-bottom:8px; font-size:15px; display:flex; justify-content:space-between; align-items:center}
        input, button, select{width:100%; padding:12px; margin:6px 0; border:1px solid #ccc; border-radius:8px; box-sizing:border-box; font-size:16px}
        .btn-send{background:var(--s); color:white; font-weight:bold; cursor:pointer; border:none}
        .order-row{padding:10px; border-bottom:1px solid #eee; font-size:13px; background:#f9f9f9; border-radius:8px; margin-bottom:5px}
        .st-pending{color:var(--w); font-weight:bold}
        .st-progress{color:#1976d2; font-weight:bold}
        .st-done{color:var(--s); font-weight:bold}
        .manual-note { font-size: 11px; color: #666; margin-bottom: 5px; display: block; }
        @media (max-width: 768px) { body { grid-template-columns: 1fr; } #sidebar { order: 2; } }
    </style>
</head>
<body>
    <div id="main">
        <div class="card">
            <h3>NEW ORDER / НОВЫЙ ЗАКАЗ</h3>
            <form id="orderForm">
                <label>1. Select from Stock / Выбрать из списка:</label>
                <select id="sort_select">
                    <option value="">-- LOADING... --</option>
                </select>
                
                <span class="manual-note">ИЛИ введите название вручную (Bins, Boxes) ниже:</span>
                
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
                    <div>
                        <label>Item/Grower:</label>
                        <input type="text" id="grower_view" placeholder="Название или Grower">
                    </div>
                    <div>
                        <label>Store/Location:</label>
                        <input type="text" id="store_view" placeholder="ST / Склад">
                    </div>
                </div>

                <label>Quantity / Количество:</label>
                <input type="number" id="qty_input" placeholder="0" required>

                <div style="display:flex; gap:10px; align-items:center; margin:10px 0; background:#fff0f0; padding:10px; border-radius:8px">
                    <input type="checkbox" id="urgent_check" style="width:20px; margin:0"> 
                    <label for="urgent_check" style="color:var(--p); font-weight:bold">URGENT / СРОЧНО</label>
                </div>

                <button type="submit" class="btn-send">SEND ORDER / ОТПРАВИТЬ</button>
            </form>
        </div>
    </div>

    <div id="sidebar">
        <div class="card">
            <h3>MY ORDERS / МОИ ЗАКАЗЫ</h3>
            <div id="my_list">Загрузка...</div>
            <button onclick="logout()" style="background:#666; color:white; margin-top:20px; border:none; border-radius:8px; padding:10px; cursor:pointer; width:100%">LOGOUT / ВЫХОД</button>
        </div>
    </div>

<script>
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    const _db = supabase.createClient(supabaseUrl, supabaseKey);
    const user = localStorage.getItem('user') || 'Line';

    async function loadStock() {
        const { data } = await _db.from('stock').select('*').order('item_name');
        const select = document.getElementById('sort_select');
        if (data) {
            select.innerHTML = '<option value="">-- MANUAL INPUT / ВРУЧНУЮ --</option>';
            data.forEach(item => {
                let opt = document.createElement('option');
                opt.value = item.item_name;
                opt.innerText = `${item.item_name} (Avail: ${item.quantity})`;
                opt.dataset.grower = item.grower || '';
                opt.dataset.store = item.store || '';
                select.appendChild(opt);
            });
        }
    }

    document.getElementById('sort_select').onchange = (e) => {
        const opt = e.target.options[e.target.selectedIndex];
        if(opt.value !== "") {
            document.getElementById('grower_view').value = opt.dataset.grower;
            document.getElementById('store_view').value = opt.dataset.store;
        }
    };

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        
        const selectVal = document.getElementById('sort_select').value;
        const growerVal = document.getElementById('grower_view').value;
        
        // Если сорт выбран - берем его, если нет - берем то что в поле Grower
        const finalSort = selectVal || growerVal || "Empty Task";
        const finalGrower = selectVal ? growerVal : "Manual";

        const { error } = await _db.from('orders').insert([{
            line: user,
            sort: finalSort,
            grower: finalGrower,
            qty: document.getElementById('qty_input').value,
            store: document.getElementById('store_view').value || 'N/A',
            urgent: document.getElementById('urgent_check').checked,
            status: 'pending',
            time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
        }]);

        if (!error) { e.target.reset(); loadOrders(); }
        else alert("Error: " + error.message);
    };

    async function loadOrders() {
        const { data } = await _db.from('orders').select('*').eq('line', user).order('id', {ascending:false}).limit(10);
        document.getElementById('my_list').innerHTML = data ? data.map(o => `
            <div class="order-row">
                <b>${o.sort}</b> — ${o.qty}<br>
                <small>${o.grower} | ${o.store}</small> | <span class="st-${o.status}">${o.status.toUpperCase()}</span>
            </div>
        `).join('') : 'No orders';
    }

    function logout() { localStorage.clear(); window.location.href='login.html'; }

    loadStock();
    loadOrders();
    setInterval(loadOrders, 5000);
</script>
</body>
</html>
