<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Peake Fruit - Line Order Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg: #f4f6f9; 
            --card-bg: #ffffff; 
            --text: #1a1a2e; 
            --text-muted: #6c757d;
            --accent: #0288d1;
            --accent-hover: #0277bd;
            --urgent: #d32f2f;
            --urgent-bg: #fff5f5;
            --process: #f59e0b; 
            --process-bg: #fff3e0;
            --done: #2e7d32; 
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 10px;
        }
        .container {
            max-width: 100%; 
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { margin: 0; font-size: 18px; color: var(--accent); }
        .user-badge { font-weight: bold; color: #01579b; background: #e3f2fd; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
        
        .logout-btn {
            background: transparent; color: var(--text-muted); border: 1px solid #cbd5e0;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .logout-btn:hover { background: #edf2f7; }

        .main-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* Блок выбора из базы/стока */
        .stock-section {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        /* Стили формы */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; text-transform: uppercase; font-weight: bold; color: var(--text-muted); }
        input, select {
            padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px;
            background: #fff; color: var(--text); box-sizing: border-box; width: 100%;
        }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        
        /* Подсветка автоматически заполненных полей */
        input.auto-filled { background: #fafafa; border-color: #cbd5e0; }

        /* Чекбокс Urgent */
        .urgent-lock {
            display: flex; align-items: center; gap: 8px; background: #fff5f5;
            border: 1px solid #fed7d7; padding: 10px; border-radius: 6px; margin-bottom: 15px;
        }
        .urgent-lock input { width: auto; cursor: pointer; }
        .urgent-lock label { color: var(--urgent); cursor: pointer; display: flex; align-items: center; gap: 4px; font-size: 13px; }

        .submit-btn {
            display: block; width: 100%; padding: 14px; background: var(--accent);
            color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.03em;
        }
        .submit-btn:hover { background: var(--accent-hover); }

        /* Таблица/карточки заказов снизу */
        .orders-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .order-row-card {
            background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .order-row-card.urgent-card { border-left: 5px solid var(--urgent); background: var(--urgent-bg); }
        .order-row-card.process-card { border-left: 5px solid var(--process); background: var(--process-bg); }

        .card-field { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #edf2f7; padding-bottom: 4px; }
        .card-field:last-of-type { border-bottom: none; padding-bottom: 0; }
        .field-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: bold; }
        .field-value { font-size: 13px; font-weight: 500; }

        .store-tag { color: #6b46c1; font-weight: bold; background: #f3e8ff; padding: 1px 6px; border-radius: 4px; }
        .qty-tag { font-weight: bold; background: #e6fffa; border: 1px solid #b2f5ea; padding: 1px 6px; border-radius: 4px; }
        code { background: #edf2f7; padding: 2px 4px; border-radius: 4px; color: #b83280; font-family: monospace; }
        
        .status-badge {
            padding: 3px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; text-transform: uppercase;
        }
        .status-badge.new { background: #e3f2fd; color: #0288d1; }
        .status-badge.process { background: #fff3e0; color: #f59e0b; }
        .status-badge.delivered { background: #e8f5e9; color: var(--done); }

        /* Адаптация под планшеты и ПК */
        @media (min-width: 768px) {
            body { padding: 20px; }
            .container { gap: 15px; }
            .main-card { padding: 20px; }
            .orders-list { display: table; width: 100%; border-collapse: collapse; }
            .order-row-card { display: table-row; background: transparent !important; }
            .card-field { display: table-cell; vertical-align: middle; padding: 10px 8px; border-bottom: 1px solid #edf2f7; }
            .field-label { display: none; }
            .desktop-headers { display: table-header-group !important; background: #f7fafc; }
            .desktop-headers th { color: var(--text-muted); padding: 10px 8px; text-align: left; font-size: 11px; text-transform: uppercase; border-bottom: 2px solid #edf2f7; }
            
            .order-row-card.urgent-card { background-color: var(--urgent-bg) !important; }
            .order-row-card.process-card { background-color: var(--process-bg) !important; }
            .order-row-card:hover { background-color: #f8fafc !important; }
        }
        .desktop-headers { display: none; }
    </style>
</head>
<body>

<script>
    const currentUser = localStorage.getItem('user');
    const currentRole = localStorage.getItem('role');
    if (!currentUser || currentRole !== 'line') {
        alert("Access denied! Please login as Line Operator.");
        localStorage.clear();
        window.location.href = 'login.html';
    }
</script>
