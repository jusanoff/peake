<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Line Panel - Peake Fruit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --s:#2e7d32; --bg:#f4f7f6; --dark:#333; --p:#d32f2f; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        #main { flex: 1 1 500px; max-width: 800px; width: 100%; }
        #sidebar { flex: 1 1 350px; max-width: 450px; width: 100%; }
        .card { background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-top: 6px solid var(--s); margin-bottom: 20px; box-sizing: border-box; }
        h3 { margin: 0 0 15px 0; color: var(--dark); border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 18px; text-transform: uppercase; }
        label { font-size: 13px; font-weight: bold; color: #666; margin-top: 10px; display: block; }
        input, button, select { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        .btn-send { background: var(--s); color: white; font-weight: bold; cursor: pointer; border: none; font-size: 18px; margin-top: 15px; }
        .btn-logout { background: #546e7a; color: white; border: none; border-radius: 10px; padding: 12px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        .manual-zone { background: #fffde7; padding: 15px; border-radius: 12px; margin: 10px 0; border: 2px dashed #fbc02d; display: flex; align-items: center; gap: 10px; }
        .order-row { padding: 15px; background: #fff; border-radius: 12px; margin-bottom: 12px; border-left: 6px solid #ccc; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #eee; border-left-width: 6px; }
        .order-row.urgent-border { border-left-color: var(--p); background: #fff8f8; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .order-time { background: #333; color: #fff; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 12px; }
        .order-title { font-size: 16px; font-weight: bold; color: #111; }
        .st-badge { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; background: #eee; }
        @media (max-width: 900px) { body { flex-direction: column; align-items: center; } #main, #sidebar { max-width: 100%; } }
    </style>
</head>
<body>

<div id="main">
    <div class="card">
        <h3 id="h_new_order">New Order</h3>
        <form id="orderForm">
            <div class="manual-zone">
                <input type="checkbox" id="manual_check" style="width:25px; height:25px; margin:0; cursor:pointer"> 
                <label for="manual_check" id="l_manual" style="margin:0; cursor:pointer; font-size:16px">Manual Input</label>
            </div>

            <label id="l_sort">1. Sort:</label>
            <select id="sort_select"><option value="">Loading...</option></select>
            <input type="text" id="sort_manual" placeholder="Enter sort manually" style="display:none">

            <label id="l_grower">2. Grower:</label>
            <select id="grower_select" disabled><option value="">Select Sort First</option></select>
            <input type="text" id="grower_manual" placeholder="Enter grower manually" style="display:none">

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px">
                <div>
                    <label id="l_store">Store:</label>
                    <input type="text" id="store_view" placeholder="-" readonly style="background:#f0f0f0">
                </div>
                <div>
                    <label>Consignment:</label>
                    <input type="text" id="consign_view" placeholder="-" readonly style="background:#f0f0f0">
                </div>
            </div>

            <label id="l_qty">Quantity:</label>
            <input type="number" id="qty_input" placeholder="0" required inputmode="numeric">

            <div style="background:#fff0f0; padding:12px; border-radius:10px; margin-top:15px; display:flex; align-items:center; gap:10px">
                <input type="checkbox" id="urgent_check" style="width:22px; height:22px; margin:0"> 
                <label for="urgent_check" id="l_urgent" style="margin:0; color:var(--p); font-weight:bold">🚀 URGENT</label>
            </div>

            <button type="submit" class="btn-send" id="btn_send">SEND ORDER</button>
        </form>
    </div>
</div>

<div id="sidebar">
    <div class="card" style="border-top-color: #666">
        <h3 id="h_history">History</h3>
        <div id="my_list">Loading...</div>
        <button onclick="logout()" class="btn-logout" id="btn_logout">LOGOUT</button>
    </div>
</div>
