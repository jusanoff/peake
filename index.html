<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Line Panel - Peake Fruit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --s:#2e7d32; --bg:#f4f7f6; --dark:#333; --w:#ff9800; --p:#d32f2f; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-wrap: wrap; /* Позволяет колонкам перепрыгивать */
            gap: 20px; 
            justify-content: center;
        }

        /* Адаптивные колонки: 60% левая, 35% правая на больших экранах */
        #main { flex: 1 1 500px; max-width: 800px; }
        #sidebar { flex: 1 1 350px; max-width: 500px; }

        .card { 
            background: #fff; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            border-top: 6px solid var(--s); 
            margin-bottom: 20px; 
            box-sizing: border-box;
        }

        h3 { margin: 0 0 15px 0; color: var(--dark); border-bottom: 1px solid #eee; padding-bottom: 10px; font-size: 18px; text-transform: uppercase; }
        
        label { font-size: 13px; font-weight: bold; color: #666; margin-top: 10px; display: block; }
        
        input, button, select { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            box-sizing: border-box; 
            font-size: 16px; 
            outline: none;
        }

        .btn-send { background: var(--s); color: white; font-weight: bold; cursor: pointer; border: none; font-size: 18px; margin-top: 15px; }
        .btn-logout { background: #546e7a; color: white; border: none; border-radius: 10px; padding: 12px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }

        .manual-zone { background: #fffde7; padding: 15px; border-radius: 12px; margin: 10px 0; border: 2px dashed #fbc02d; }
        .checkbox-container { display: flex; align-items: center; gap: 10px; cursor: pointer; }

        /* Стили истории */
        .order-row { 
            padding: 15px; 
            background: #fff; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            border-left: 6px solid #ccc; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); 
            border-right: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }
        .order-row.urgent-border { border-left-color: var(--p); background: #fff8f8; }
        .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .order-time { background: #333; color: #fff; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 12px; }
        .order-title { font-size: 16px; font-weight: bold; color: #111; }
        .order-details { color: #444; font-size: 13px; line-height: 1.5; }
        .st-badge { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; text-transform: uppercase; background: #eee; color: #666; }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .card { padding: 15px; }
            #main, #sidebar { max-width: 100%; flex: 1 1 100%; }
        }
    </style>
</head>
<body>

<div id="main">
    <div class="card">
        <h3>📦 Новый заказ / New Order</h3>
        <form id="orderForm">
            <div class="manual-zone">
                <label class="checkbox-container">
                    <input type="checkbox" id="manual_check" style="width:22px; height:22px; margin:0"> 
                    <span style="font-size:15px; color:#000; font-weight:bold">Ввести данные вручную</span>
                </label>
            </div>

            <div id="auto_fields">
                <label>1. Сорт (Sort):</label>
                <select id="sort_select"><option value="">Загрузка...</option></select>
                
                <label>2. Гровер (Grower):</label>
                <select id="grower_select" disabled><option value="">Сначала выберите сорт</option></select>
            </div>

            <div id="manual_fields" style="display:none">
                <label>Сорт / Тара (вручную):</label>
                <input type="text" id="sort_manual" placeholder="Напр: Bins">
                <label>Гровер (вручную):</label>
                <input type="text" id="grower_manual" placeholder="Имя гровера">
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px">
                <div>
                    <label>Склад (Store):</label>
                    <input type="text" id="store_view" placeholder="-" readonly style="background:#f0f0f0">
                </div>
                <div>
                    <label>Consign:</label>
                    <input type="text" id="consign_view" placeholder="-" readonly style="background:#f0f0f0">
                </div>
            </div>

            <label>Количество (Qty):</label>
            <input type="number" id="qty_input" placeholder="0" required inputmode="numeric">

            <label class="checkbox-container" style="margin-top:15px; background:#fff0f0; padding:12px; border-radius:10px">
                <input type="checkbox" id="urgent_check" style="width:22px; height:22px; margin:0"> 
                <span style="color:var(--p); font-weight:bold">🚀 СРОЧНО (URGENT)</span>
            </label>

            <button type="submit" class="btn-send">ОТПРАВИТЬ ЗАКАЗ</button>
        </form>
    </div>
</div>

<div id="sidebar">
    <div class="card" style="border-top-color: #666">
        <h3>🕒 История / History</h3>
        <div id="my_list">Загрузка истории...</div>
        <button onclick="logout()" class="btn-logout">ВЫЙТИ (LOGOUT)</button>
    </div>
</div>

<script>
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    const _db = supabase.createClient(supabaseUrl, supabaseKey);
    const user = localStorage.getItem('user') || 'Line';

    let fullStock = [];

    document.getElementById('manual_check').onchange = function() {
        const isM = this.checked;
        document.getElementById('auto_fields').style.display = isM ? 'none' : 'block';
        document.getElementById('manual_fields').style.display = isM ? 'block' : 'none';
        const views = [document.getElementById('store_view'), document.getElementById('consign_view')];
        views.forEach(v => {
            v.readOnly = !isM;
            v.style.background = isM ? '#fff' : '#f0f0f0';
            v.value = "";
        });
    };

    async function loadStock() {
        try {
            const { data } = await _db.from('stock').select('*');
            fullStock = data || [];
            const sortSel = document.getElementById('sort_select');
            const uniqueSorts = [...new Set(fullStock.map(i => i.item_name))];
            sortSel.innerHTML = '<option value="">-- Выберите сорт --</option>' + 
                uniqueSorts.map(s => `<option value="${s}">${s}</option>`).join('');
        } catch(e) { console.error("Stock error", e); }
    }

    document.getElementById('sort_select').onchange = function() {
        const sort = this.value;
        const gSel = document.getElementById('grower_select');
        gSel.value = "";
        if(!sort) { gSel.disabled = true; return; }
        const filtered = fullStock.filter(i => i.item_name === sort);
        gSel.disabled = false;
        gSel.innerHTML = '<option value="">-- Выберите гровера --</option>' + 
            filtered.map(g => `<option value="${g.grower}" data-st="${g.store}" data-con="${g.consignment || ''}">${g.grower}</option>`).join('');
    };

    document.getElementById('grower_select').onchange = function() {
        const opt = this.options[this.selectedIndex];
        document.getElementById('store_view').value = opt.dataset.st || "";
        document.getElementById('consign_view').value = opt.dataset.con || "";
    };

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const isM = document.getElementById('manual_check').checked;
        const s = isM ? document.getElementById('sort_manual').value : document.getElementById('sort_select').value;
        const g = isM ? document.getElementById('grower_manual').value : document.getElementById('grower_select').value;

        if(!s || !g) { alert("Заполните Сорт и Гровера!"); return; }

        const { error } = await _db.from('orders').insert([{
            line: user, 
            sort: s, 
            grower: g,
            qty: document.getElementById('qty_input').value,
            store: document.getElementById('store_view').value,
            consign: document.getElementById('consign_view').value,
            urgent: document.getElementById('urgent_check').checked,
