<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Line Panel - Peake Fruit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --s:#2e7d32; --bg:#f4f7f6; --dark:#333; --w:#ff9800; --p:#d32f2f; }
        body{font-family:sans-serif; background:var(--bg); margin:0; padding:10px; display:grid; grid-template-columns: 1fr 340px; gap:15px}
        .card{background:#fff; padding:15px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1); border-top:5px solid var(--s); margin-bottom:15px}
        h3{margin:0; padding-bottom:8px; border-bottom:1px solid #eee; display:flex; justify-content:space-between}
        input, button, select{width:100%; padding:12px; margin:6px 0; border:1px solid #ccc; border-radius:8px; box-sizing:border-box}
        .btn-send{background:var(--s); color:white; font-weight:bold; cursor:pointer}
        .order-row{padding:8px; border-bottom:1px solid #eee; font-size:13px}
        .st-waiting{color:var(--w); font-weight:bold}
        .st-done{color:var(--s); font-weight:bold}
    </style>
</head>
<body>
    <div id="main">
        <div class="card">
            <h3 id="t_order">NEW ORDER</h3>
            <form id="orderForm">
                <select id="sort"><option>Select Fruit/Sort</option></select>
                <input type="text" id="grower" placeholder="Grower" readonly>
                <input type="text" id="store" placeholder="Store" readonly>
                <input type="number" id="qty" placeholder="Quantity" required>
                <div style="display:flex; gap:10px; align-items:center; margin:10px 0">
                    <input type="checkbox" id="urgent" style="width:20px"> <label for="urgent">URGENT / СРОЧНО</label>
                </div>
                <button type="submit" class="btn-send">SEND ORDER</button>
            </form>
        </div>
    </div>

    <div id="sidebar">
        <div class="card">
            <h3>MY ORDERS</h3>
            <div id="my_list">Loading...</div>
            <button onclick="logout()" style="background:#666; color:white; margin-top:20px">LOGOUT</button>
        </div>
    </div>

<script>
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    const _db = supabase.createClient(supabaseUrl, supabaseKey);
    const user = localStorage.getItem('user') || 'Line';

    async function loadStock() {
        const { data } = await _db.from('stock').select('*');
        const sortSelect = document.getElementById('sort');
        sortSelect.innerHTML = '<option value="">-- Select --</option>';
        data.forEach(item => {
            let opt = document.createElement('option');
            opt.value = item.id;
            opt.innerText = `${item.item_name} (${item.quantity})`;
            opt.dataset.grower = item.grower;
            opt.dataset.store = item.store;
            sortSelect.appendChild(opt);
        });
    }

    document.getElementById('sort').onchange = (e) => {
        const opt = e.target.options[e.target.selectedIndex];
        document.getElementById('grower').value = opt.dataset.grower || '';
        document.getElementById('store').value = opt.dataset.store || '';
    };

    document.getElementById('orderForm').onsubmit = async (e) => {
        e.preventDefault();
        const sel = document.getElementById('sort');
        const sortName = sel.options[sel.selectedIndex].text.split(' (')[0];
        
        await _db.from('orders').insert([{
            line: user,
            sort: sortName,
            grower: document.getElementById('grower').value,
            qty: document.getElementById('qty').value,
            store: document.getElementById('store').value,
            urgent: document.getElementById('urgent').checked,
            status: 'pending',
            time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
        }]);
        
        e.target.reset();
        loadOrders();
    };

    async function loadOrders() {
        const { data } = await _db.from('orders').select('*').eq('line', user).order('id', {ascending:false});
        document.getElementById('my_list').innerHTML = data.map(o => `
            <div class="order-row">
                <b>${o.sort}</b> - ${o.qty} <br>
                <span class="${o.status === 'pending' ? 'st-waiting' : 'st-done'}">${o.status.toUpperCase()}</span>
            </div>
        `).join('') || 'No orders yet';
    }

    function logout() { localStorage.clear(); window.location.href='login.html'; }

    loadStock();
    loadOrders();
    setInterval(loadOrders, 5000);
</script>
</body>
</html>
