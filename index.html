<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Peake Fruit - Place Order</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg: #f4f6f9; 
            --card-bg: #ffffff; 
            --text: #1a1a2e; 
            --accent: #0288d1;
            --accent-hover: #0277bd;
            --urgent: #d32f2f;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .order-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
        }
        h2 { margin-top: 0; color: var(--text); font-size: 24px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .info-box { background: #e3f2fd; padding: 10px 15px; border-radius: 6px; color: #0d47a1; font-weight: bold; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #4a5568; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        textarea { resize: vertical; min-height: 80px; }
        
        .urgent-zone {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff5f5;
            border: 1px solid #fed7d7;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .urgent-zone input[type="checkbox"] { width: auto; cursor: pointer; }
        .urgent-zone label { margin-bottom: 0; color: var(--urgent); cursor: pointer; }

        .btn-submit {
            background: var(--accent);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: var(--accent-hover); }
        .btn-logout {
            background: transparent;
            color: #718096;
            border: 1px solid #cbd5e0;
            width: 100%;
            padding: 8px;
            font-size: 14px;
            margin-top: 10px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-logout:hover { background: #edf2f7; color: var(--text); }
    </style>
</head>
<body>

<script>
    // --- СТРОГАЯ ПРОВЕРКА БЕЗОПАСНОСТИ ДО РЕНДЕРИНГА СТРАНИЦЫ ---
    const currentUser = localStorage.getItem('user');
    const currentRole = localStorage.getItem('role');
    const displayName = localStorage.getItem('name') || currentUser;

    // Если не авторизован или роль НЕ является 'line' — выкидываем на логин
    if (!currentUser || currentRole !== 'line') {
        alert("Access denied! Only production lines are allowed to place orders.");
        localStorage.clear();
        window.location.href = 'login.html';
    }
</script>

<div class="order-card">
    <h2>Create New Order</h2>
    
    <div class="info-box">
        Ordering from: <span id="lbl_line_name">Line Name</span>
    </div>

    <form id="order_form" onsubmit="submitOrder(event)">
        <div class="form-group">
            <label for="inp_desc">Description / Item Name *</label>
            <input type="text" id="inp_desc" placeholder="e.g., Apple Bins, Empty Pallets" required>
        </div>

        <div class="form-group">
            <label for="inp_grower">Grower Name</label>
            <input type="text" id="inp_grower" placeholder="e.g., Smith Orchard">
        </div>

        <div class="form-group">
            <label for="inp_cons">Consignment Number</label>
            <input type="text" id="inp_cons" placeholder="e.g., CS90210">
        </div>

        <div class="form-group">
            <label for="inp_store">Store / Location</label>
            <input type="text" id="inp_store" placeholder="e.g., Cold Store 3">
        </div>

        <div class="form-group">
            <label for="inp_qty">Quantity</label>
            <input type="number" id="inp_qty" placeholder="e.g., 5" min="1">
        </div>

        <div class="urgent-zone">
            <input type="checkbox" id="chk_urgent">
            <label for="chk_urgent">⚠️ MARK AS URGENT (High Priority)</label>
        </div>

        <button type="submit" class="btn-submit">Send Order</button>
        <button type="button" class="btn-logout" onclick="logout()">Log Out</button>
    </form>
</div>

<script>
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    const _db = supabase.createClient(supabaseUrl, supabaseKey);

    // Выводим имя текущей линии на экран
    document.getElementById('lbl_line_name').innerText = displayName;

    async function submitOrder(e) {
        e.preventDefault();

        // Формируем данные заказа
        const orderData = {
            line: displayName, // Заказчиком железно записывается имя авторизованной Линии
            description: document.getElementById('inp_desc').value,
            grower: document.getElementById('inp_grower').value || null,
            consignment: document.getElementById('inp_cons').value || null,
            store: document.getElementById('inp_store').value || null,
            quantity: document.getElementById('inp_qty').value ? parseInt(document.getElementById('inp_qty').value) : null,
            urgent: document.getElementById('chk_urgent').checked, // Отправляем true/false
            status: 'new' // Всегда создается со статусом 'new'
        };

        try {
            const { error } = await _db
                .from('orders')
                .insert([orderData]);

            if (error) throw error;

            alert("Order successfully sent to TV Board!");
            document.getElementById('order_form').reset();
            document.getElementById('lbl_line_name').innerText = displayName; // возвращаем текст после сброса формы
            
        } catch (error) {
            alert("Error sending order: " + error.message);
        }
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
