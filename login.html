<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему - Peake Fruit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p:#d32f2f; --s:#1a1a2e; --bg:#f0f2f5; }
        body { font-family: sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); width: 100%; max-width: 360px; box-sizing: border-box; }
        h2 { margin-top: 0; color: var(--s); text-align: center; margin-bottom: 20px; }
        input, button { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
        button { background: var(--p); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #b71c1c; }
        
        .lang-select { text-align: center; margin-bottom: 15px; }
        /* Базовые стили для кнопок выбора языка */
        .lang-select button { 
            width: auto; 
            display: inline-block; 
            padding: 6px 12px; 
            margin: 0 3px; 
            background: #eee; 
            color: #333; 
            font-size: 12px; 
            cursor: pointer; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-weight: bold;
            transition: all 0.2s ease;
        }
        /* Стиль для ВЫДЕЛЕННОЙ кнопки языка */
        .lang-select button.active {
            background: var(--p);
            color: white;
            border-color: var(--p);
            box-shadow: 0 2px 5px rgba(211, 47, 47, 0.3);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="lang-select">
            <button id="lang_ru" onclick="changeLang('ru')">RU</button>
            <button id="lang_en" onclick="changeLang('en')">EN</button>
            <button id="lang_lt" onclick="changeLang('lt')">LT</button>
        </div>
        
        <h2 id="log_title">Авторизация</h2>
        
        <form id="loginForm">
            <input type="text" id="username" placeholder="Логин" required autocomplete="username">
            <input type="password" id="password" placeholder="Пароль" required autocomplete="current-password">
            <button type="submit" id="btn_enter">ВОЙТИ</button>
        </form>
    </div>

<script>
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    const _db = supabase.createClient(supabaseUrl, supabaseKey);

    const lang = {
        ru: { title: "Авторизация", u_ph: "Логин", p_ph: "Пароль", btn: "ВОЙТИ", err: "Неверный логин или пароль!" },
        en: { title: "Login", u_ph: "Username", p_ph: "Password", btn: "LOG IN", err: "Wrong username or password!" },
        lt: { title: "Prisijungimas", u_ph: "Prisijungimo vardas", p_ph: "Slaptažodis", btn: "PRISIJUNGTI", err: "Neteisingas vardas arba slaptažodis!" }
    };

    let curL = localStorage.getItem('lang') || 'ru';

    function changeLang(l) {
        curL = l;
        localStorage.setItem('lang', l);
        updateUI();
    }

    function updateUI() {
        const t = lang[curL];
        document.getElementById('log_title').innerText = t.title;
        document.getElementById('username').placeholder = t.u_ph;
        document.getElementById('password').placeholder = t.p_ph;
        document.getElementById('btn_enter').innerText = t.btn;

        // КРАСИВОЕ ВЫДЕЛЕНИЕ КНОПОК ЯЗЫКА:
        // Сначала убираем класс active у всех трех кнопок
        document.getElementById('lang_ru').classList.remove('active');
        document.getElementById('lang_en').classList.remove('active');
        document.getElementById('lang_lt').classList.remove('active');

        // Добавляем класс active только выбранной кнопке
        const activeBtn = document.getElementById(`lang_${curL}`);
        if (activeBtn) {
            activeBtn.classList.add('active');
        }
    }

    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault();
        
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value.trim();

        try {
            const { data, error } = await _db
                .from('users_table')
                .select('*')
                .eq('u', usernameInput)
                .single();

            if (error || !data || String(data.p).trim() !== passwordInput) {
                alert(lang[curL]?.err || "Неверный логин или пароль!");
                return;
            }

            const userRole = String(data.t || '').toLowerCase().trim();

            localStorage.setItem('user', data.u);
            localStorage.setItem('role', userRole); 
            localStorage.setItem('name', data.name || data.u); 
            localStorage.setItem('lang', curL);

            if (userRole === 'admin') {
                window.location.href = 'superadmin.html';
            } else if (userRole === 'office') {
                window.location.href = 'office.html';
            } else if (userRole === 'driver') {
                window.location.href = 'driver.html';
            } else if (userRole === 'runner') {
                window.location.href = 'runner.html';
            } else {
                window.location.href = 'index.html';
            }

        } catch (err) {
            console.error("Критическая ошибка:", err);
            alert("Connection error / Ошибка соединения");
        }
    };
    
    updateUI();
</script>
</body>
</html>
