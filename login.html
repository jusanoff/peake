<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peake Fruit - Вход</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #ffffff; color: #333; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 350px; text-align: center; }
        h2 { margin-bottom: 25px; color: #1a1a2e; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #1b5e20; }
        #msg { margin-top: 15px; font-size: 14px; min-height: 20px; font-weight: 500; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Peake Fruit System</h2>
    <input type="text" id="u_name" placeholder="Логин (например, admin)">
    <input type="password" id="u_pass" placeholder="Пароль (например, 777)">
    <button type="button" id="loginBtn">ВОЙТИ</button>
    <div id="msg"></div>
</div>

<script>
    // Настройки твоей базы данных
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    
    // Инициализация клиента базы
    const _db = supabase.createClient(supabaseUrl, supabaseKey);

    // Логика кнопки
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const u = document.getElementById('u_name').value.trim();
        const p = document.getElementById('u_pass').value.trim();
        const msg = document.getElementById('msg');

        if (!u || !p) {
            msg.style.color = "orange";
            msg.innerText = "Введите логин и пароль";
            return;
        }

        msg.style.color = "#666";
        msg.innerText = "Проверка данных...";

        try {
            // Ищем пользователя в таблице
            const { data, error } = await _db
                .from('app_users')
                .select('*')
                .eq('username', u.toLowerCase())
                .eq('password', p)
                .maybeSingle();

            if (error) throw error;

            if (data) {
                msg.style.color = "green";
                msg.innerText = "Успешно! Входим...";
                
                // Сохраняем данные в браузере
                localStorage.setItem('user', data.username);
                localStorage.setItem('role', data.role);
                
                // Переходим на страницу роли (например, office.html или driver.html)
                setTimeout(() => {
                    window.location.href = data.role + '.html';
                }, 800);
            } else {
                msg.style.color = "red";
                msg.innerText = "Неверный логин или пароль!";
            }
        } catch (err) {
            console.error("Ошибка системы:", err);
            msg.style.color = "red";
            msg.innerText = "Ошибка базы: " + err.message;
        }
    });
</script>

</body>
</html>
