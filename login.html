<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Peake Fruit</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body{font-family:sans-serif; background:#1a1a2e; display:flex; justify-content:center; align-items:center; height:100vh; margin:0}
        .card{background:#fff; padding:30px; border-radius:15px; width:300px; text-align:center; box-shadow:0 10px 20px rgba(0,0,0,0.3)}
        select, input, button{width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ccc; font-size:16px}
        button{background:#2e7d32; color:white; border:none; font-weight:bold; cursor:pointer}
        .super-link { font-size: 10px; color: #ccc; text-decoration: none; margin-top: 10px; display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="title">PEAKE FRUIT</h2>
        <select id="u_select"><option>Loading users...</option></select>
        <input type="password" id="pass_input" placeholder="Password">
        <button onclick="doLogin()">LOGIN / ВХОД</button>
        <a href="#" class="super-link" onclick="adminLogin()">SUPERADMIN ACCESS</a>
    </div>

<script>
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    const _db = supabase.createClient(supabaseUrl, supabaseKey);

    let allUsers = [];

    async function loadUsers() {
        const { data } = await _db.from('app_users').select('*');
        if(data) {
            allUsers = data;
            const select = document.getElementById('u_select');
            select.innerHTML = '';
            data.forEach(user => {
                let opt = document.createElement('option');
                opt.value = user.username;
                opt.innerText = user.username.toUpperCase() + ' (' + user.role.toUpperCase() + ')';
                select.appendChild(opt);
            });
        }
    }

    async function doLogin() {
        const uName = document.getElementById('u_select').value;
        const uPass = document.getElementById('pass_input').value;
        const found = allUsers.find(u => u.username === uName && u.password === uPass);

        if(found) {
            localStorage.setItem('user', found.username);
            localStorage.setItem('role', found.role);
            window.location.href = (found.role === 'office') ? 'office.html' : (found.role === 'driver' ? 'driver.html' : 'index.html');
        } else {
            alert("Wrong Password!");
        }
    }

    function adminLogin() {
        if(prompt("Enter Master Password:") === "MASTER777") window.location.href = 'superadmin.html';
    }

    loadUsers();
</script>
</body>
</html>
