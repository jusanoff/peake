<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Peake Fruit — Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #0f172a;
            --accent: #0288d1;
            --border: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-container {
            width: 100%;
            max-width: 360px;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            background: var(--card-bg);
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            color: var(--accent);
            text-align: center;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            background: #f8fafc;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background: #fff;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 2px 4px rgba(2, 136, 209, 0.2);
        }

        .btn-login:hover {
            background: #01579b;
        }

        .error-message {
            color: #dc2626;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            margin-top: 12px;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-card">
        <h2>Peake Fruit Terminal</h2>
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username (e.g. hl1)">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>

        <button class="btn-login" onclick="handleLogin()">Sign In</button>
        
        <div class="error-message" id="error_display"></div>
    </div>
</div>

<script>
    // Точно такие же ключи Supabase, как и на остальных страницах
    const k1 = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.';
    const k2 = 'eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.';
    const k3 = 'LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';

    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = k1 + k2 + k3;
    const clientDb = supabase.createClient(supabaseUrl, supabaseKey);

    // Функция обработки клика войти
    async function handleLogin() {
        const userField = document.getElementById('username').value.trim();
        const passField = document.getElementById('password').value.trim();
        const errorDisplay = document.getElementById('error_display');

        errorDisplay.innerText = ""; // Очищаем старые ошибки

        if (!userField || !passField) {
            errorDisplay.innerText = "Please fill in all fields.";
            return;
        }

        try {
            // ИСПРАВЛЕНО: ищем в правильной таблице 'users_table' по колонке 'u'
            const { data, error } = await clientDb
                .from('users_table')
                .select('*')
                .eq('u', userField)
                .single();

            if (error || !data) {
                errorDisplay.innerText = "User not found!";
                return;
            }

            // Проверяем пароль (учитываем колонку p или password, подставьте вашу)
            const dbPassword = data.p || data.password;

            if (String(dbPassword).trim() !== passField) {
                errorDisplay.innerText = "Incorrect password!";
                return;
            }

            // Получаем роль и приводим к нижнему регистру (Driver -> driver, Line -> line)
            const rawRole = data.role || data.Role || '';
            const cleanRole = rawRole.toLowerCase().trim();

            // Сохраняем чистые данные в память устройства
            localStorage.setItem('user', data.u);
            localStorage.setItem('role', cleanRole);
            localStorage.setItem('display_name', data.name || data.u);

            // Перенаправляем в зависимости от роли
            if (cleanRole === 'driver') {
                window.location.href = 'driver.html';
            } else {
                // Если роль line, office или любая другая — отправляем на главную
                window.location.href = 'index.html';
            }

        } catch (err) {
            console.error("Login process error:", err);
            errorDisplay.innerText = "Connection error. Please try again.";
        }
    }

    // Позволяет отправлять форму нажатием клавиши Enter
    document.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            handleLogin();
        }
    });
</script>
</body>
</html>
