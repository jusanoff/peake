<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Peake Fruit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #2e7d32; margin-bottom: 20px; }
        select, input, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { background: #2e7d32; color: white; border: none; font-weight: bold; cursor: pointer; }
        .lang-select { background: #e8f5e9; border: 2px solid #2e7d32; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2 id="title">Select Language</h2>
        <select id="lang" class="lang-select" onchange="updateLang()">
            <option value="en">English</option>
            <option value="ru">Русский</option>
        </select>
        <input type="text" id="username" placeholder="Line Name (e.g. Line 1)">
        <button onclick="login()" id="btn">LOGIN</button>
    </div>

    <script>
        function updateLang() {
            const lang = document.getElementById('lang').value;
            const t = document.getElementById('title');
            const u = document.getElementById('username');
            const b = document.getElementById('btn');
            
            if(lang === 'ru') {
                t.innerText = "Выберите язык";
                u.placeholder = "Название линии (напр. Линия 1)";
                b.innerText = "ВОЙТИ";
            } else {
                t.innerText = "Select Language";
                u.placeholder = "Line Name (e.g. Line 1)";
                b.innerText = "LOGIN";
            }
        }

        function login() {
            const user = document.getElementById('username').value;
            const lang = document.getElementById('lang').value;
            if(!user) return alert(lang === 'ru' ? "Введите имя!" : "Enter name!");
            
            localStorage.setItem('user', user);
            localStorage.setItem('lang', lang);
            window.location.href = 'index.html';
        }
        updateLang();
    </script>
</body>
</html>
