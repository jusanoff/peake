<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Peake Fruit — Production Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .header h1 { margin: 0; font-size: 18px; color: var(--accent); }
        .btn-logout {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 1024px) {
            .dashboard-grid { grid-template-columns: 2fr 1fr; }
        }

        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
        }
        .panel h2 { margin-top: 0; font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 12px; color: #fff; }

        .table-responsive {
            overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 8px; font-size: 11px; text-transform: uppercase; color: var(--text-muted); border-bottom: 2px solid var(--border); }
        td { padding: 10px 8px; font-size: 13px; border-bottom: 1px solid var(--border); }

        .status-badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .status-new { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .status-accepted { background: rgba(59,130,246,0.2); color: #3b82f6; }
        .status-delivered { background: rgba(16,185,129,0.2); color: #10b981; }

        .reply-box { display: flex; gap: 4px; margin-top: 4px; }
        .reply-box input { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 4px; font-size: 12px; border-radius: 4px; flex: 1; }
        .btn-reply { background: #475569; color: #fff; border: none; padding: 4px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Peake Fruit — Production Terminal Dashboard</h1>
        <button class="btn-logout" onclick="localStorage.clear(); window.location.href='login.html';">Log Out</button>
    </div>

    <div class="dashboard-grid">
        <div class="panel">
            <h2>Live Production Orders Pipeline (Last 5 Requests)</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Time</th>
                            <th>Line</th>
                            <th>Description</th>
                            <th>Consignment</th>
                            <th>Store</th>
                            <th>Qty</th>
                            <th>Logs & Comments</th>
                            <th>Driver</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="dashboard_orders_body">
                        <tr><td colspan="10" style="text-align:center; color:var(--text-muted);">Loading active pipeline...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="panel">
            <h2>Quick Live Stock Explorer</h2>
            <div style="margin-bottom: 10px;">
                <input type="text" id="stock_search" placeholder="Search by Variety, Consignment or Store..." style="width:100%; padding:8px; background:#0f172a; border:1px solid var(--border); color:white; border-radius:6px; box-sizing:border-box;" oninput="searchStockLocal()">
            </div>
            <div class="table-responsive" style="max-height: 400px;">
                <table>
                    <thead>
                        <tr>
                            <th>Consignment</th>
                            <th>Variety / Description</th>
                            <th>Store</th>
                            <th>Available</th>
                        </tr>
                    </thead>
                    <tbody id="dashboard_stock_body">
                        <tr><td colspan="4" style="text-align:center; color:var(--text-muted);">Loading stock base...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    const currentUser = localStorage.getItem('user');
    const currentRole = localStorage.getItem('role');

    if (!currentUser || currentRole !== 'production') {
        alert("Access denied!");
        localStorage.clear();
        window.location.href = 'login.html';
    }

    const k1 = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.';
    const k2 = 'eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.';
    const k3 = 'LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';

    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = k1 + k2 + k3;
    const clientDb = supabase.createClient(supabaseUrl, supabaseKey);

    let localStockArray = [];

    function formatTime(isoString) {
        if (!isoString) return '-';
        const date = new Date(isoString);
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    async function loadDashboardData() {
        try {
            // === ВОТ ЗДЕСЬ ЗАПОМИНАЕМ ТЕКСТ И КУРСОР В ТАБЛИЦЕ ЗАКАЗОВ ===
            const activeElement = document.activeElement;
            let focusedInputId = null;
            let savedValue = "";
            if (activeElement && activeElement.tagName === 'INPUT') {
                focusedInputId = activeElement.id;
                savedValue = activeElement.value;
            }

            const { data: orders, error: oErr } = await clientDb
                .from('orders')
                .select('*')
                .order('id', { ascending: false })
                .limit(5);

            if (oErr) throw oErr;

            let oHtml = "";
            if (!orders || orders.length === 0) {
                oHtml = `<tr><td colspan="10" style="text-align:center; color:var(--text-muted);">No orders created today yet.</td></tr>`;
            } else {
                orders.forEach(o => {
                    let statusClass = "status-new";
                    if (o.status === 'accepted') statusClass = "status-accepted";
                    if (o.status === 'delivered') statusClass = "status-delivered";

                    let logsHtml = `<div style="color:#fff;">Line: ${o.comment || '-'}</div>`;
                    if (o.driver_comment) {
                        logsHtml += `<div style="color:#10b981; font-size:11px; margin-top:2px;">Driver: ${o.driver_comment}</div>`;
                    }
                    if (o.office_comment) {
                        logsHtml += `<div style="color:#38bdf8; font-size:11px; margin-top:2px;">Office: ${o.office_comment}</div>`;
                    }

                    oHtml += `
                        <tr>
                            <td>#${o.id}</td>
                            <td>${formatTime(o.created_at)}</td>
                            <td><strong>${o.line || '-'}</strong></td>
                            <td>${o.description || '-'}</td>
                            <td><span style="font-family:monospace; background:#334155; padding:2px 4px; border-radius:3px;">${o.consignment || '-'}</span></td>
                            <td><span style="color:#c084fc; font-weight:700;">${o.store || '-'}</span></td>
                            <td><strong style="color:#38bdf8;">${o.qty || '1'}</strong></td>
                            <td>${logsHtml}</td>
                            <td>${o.driver_name ? '🚚 ' + o.driver_name : '<span style="color:var(--text-muted);">Waiting...</span>'}</td>
                            <td><span class="status-badge ${statusClass}">${o.status || 'new'}</span></td>
                        </tr>
                    `;
                });
            }

            document.getElementById('dashboard_orders_body').innerHTML = oHtml;

            // === ВОТ ЗДЕСЬ ВОЗВРАЩАЕМ ВСЁ НА МЕСТО ПОСЛЕ ОБНОВЛЕНИЯ ===
            if (focusedInputId) {
                const inputEl = document.getElementById(focusedInputId);
                if (inputEl) {
                    inputEl.value = savedValue;
                    inputEl.focus();
                }
            }

        } catch (e) { console.error("Dashboard pipeline error:", e); }
    }

    async function loadInitialStock() {
        try {
            const { data: stock, error: sErr } = await clientDb
                .from('stock')
                .select('*')
                .order('id', { ascending: true });

            if (sErr) throw sErr;
            localStockArray = stock || [];
            searchStockLocal(); 
        } catch (e) { console.error("Dashboard stock error:", e); }
    }

    function searchStockLocal() {
        const query = document.getElementById('stock_search').value.toLowerCase().trim();
        const tbody = document.getElementById('dashboard_stock_body');

        const filtered = localStockArray.filter(s => {
            const cons = String(s.consignment || "").toLowerCase();
            const desc = String(s.description || "").toLowerCase();
            const store = String(s.store || "").toLowerCase();
            const grower = String(s.grower || "").toLowerCase();
            return cons.includes(query) || desc.includes(query) || store.includes(query) || grower.includes(query);
        });

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No matching stock found.</td></tr>`;
            return;
        }

        let html = "";
        filtered.forEach(s => {
            html += `
                <tr>
                    <td><span style="font-family:monospace; background:#334155; padding:2px 4px; border-radius:3px;">${s.consignment || '-'}</span></td>
                    <td><strong>${s.description || '-'}</strong><br><small style="color:var(--text-muted);">${s.grower || '-'}</small></td>
                    <td><span style="color:#c084fc; font-weight:700;">${s.store || '-'}</span></td>
                    <td><strong style="color:var(--success); font-size:14px;">${s.available || '0'}</strong></td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    // Первичная загрузка
    loadDashboardData();
    loadInitialStock();

    // Каждые 5 секунд обновляем пайплайн заказов (поиск по стоку не сбрасывается, так как он локальный)
    setInterval(loadDashboardData, 5000);
</script>
</body>
</html>
