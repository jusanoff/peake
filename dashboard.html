<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Peake Fruit — Production Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
        }

        .dashboard-container {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header-title h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
        }

        .header-title p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            background: #0284c7;
            padding: 6px 12px;
            border-radius: 20px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }

        .table-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #111827;
            color: var(--accent);
            padding: 16px 12px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
            border-bottom: 3px solid var(--border-color);
        }

        td {
            padding: 16px 12px;
            font-size: 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 500;
            white-space: nowrap;
        }

        tr:nth-child(even) {
            background-color: rgba(255,255,255,0.02);
        }

        .badge-store {
            background: #6b21a8;
            color: #f3e8ff;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 18px;
        }

        .badge-qty {
            background: #0369a1;
            color: #e0f2fe;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 18px;
        }

        .status-pill {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
        }
        .status-pill.new { background: #7c2d12; color: #ffedd5; }
        .status-pill.accepted { background: #1e3a8a; color: #dbeafe; }

        .row-blink {
            animation: urgentBlink 1.5s infinite alternate;
        }

        @keyframes urgentBlink {
            0% { background-color: rgba(220, 38, 38, 0.1); }
            100% { background-color: rgba(220, 38, 38, 0.35); }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <div class="header-panel">
        <div class="header-title">
            <h1>Peake Fruit — Live Production Overview</h1>
            <p id="live_clock">Loading time...</p>
        </div>
        <div class="live-indicator">
            <div class="pulse-dot"></div>
            <span>LIVE MONITOR</span>
        </div>
    </div>

    <div class="table-panel">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Line</th>
                    <th>Time</th>
                    <th>Store</th>
                    <th>Variety / Fruit Description</th>
                    <th>Grower</th>
                    <th>Consignment</th>
                    <th>Size</th>
                    <th>Qty</th>
                    <th>Comments & Replies</th>
                    <th>Assigned Driver</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="dashboard_tbody">
                <tr>
                    <td colspan="12" style="text-align: center; padding: 40px; color: var(--text-muted); font-size: 18px;">
                        Connecting to live database stream...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function updateClock() {
        const now = new Date();
        document.getElementById('live_clock').innerText = 'Factory Floor Monitor | ' + now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    const k1 = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.';
    const k2 = 'eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.';
    const k3 = 'LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';

    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = k1 + k2 + k3;
    const clientDb = supabase.createClient(supabaseUrl, supabaseKey);

    function formatTime(isoString) {
        if (!isoString) return '-';
        const date = new Date(isoString);
        if (isNaN(date.getTime())) return '-';
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    async function fetchLiveOrders() {
        try {
            const { data: orders, error } = await clientDb
                .from('orders')
                .select('*')
                .neq('status', 'delivered') 
                .order('urgent', { ascending: false })
                .order('id', { ascending: false });

            if (error) throw error;

            if (!orders || orders.length === 0) {
                document.getElementById('dashboard_tbody').innerHTML = `
                    <tr>
                        <td colspan="12" style="text-align: center; padding: 50px; color: var(--text-muted); font-size: 20px; font-weight: 600;">
                            📭 No active pallet requests at the moment.
                        </td>
                    </tr>
                `;
                return;
            }

            const html = orders.map(o => {
                const isUrgent = o.urgent === true ? 'class="row-blink"' : '';
                const statusLwr = (o.status || 'new').toLowerCase();
                const driverDisplay = o.driver_name ? '🚚 ' + o.driver_name : '⚡ Waiting...';

                let commentBlock = `<div style="font-size: 14px; color: var(--text-main); font-weight: 500;">Line: ${o.comment || '-'}</div>`;
                if (o.driver_comment) {
                    commentBlock += `<div style="font-size: 13px; color: #4ade80; font-weight: bold; margin-top: 2px;">➜ Driver: ${o.driver_comment}</div>`;
                }
                if (o.office_comment) {
                    commentBlock += `<div style="font-size: 13px; color: #38bdf8; font-weight: bold; margin-top: 2px;">➜ Office: ${o.office_comment}</div>`;
                }

                return `
                    <tr ${isUrgent}>
                        <td style="color: var(--text-muted); font-family: monospace;">#${o.id}</td>
                        <td style="font-size: 18px; font-weight: 800; color: #ffffff;">${o.line || '-'}</td>
                        <td style="color: #cbd5e1; font-weight: 600;">${formatTime(o.created_at)}</td>
                        <td><span class="badge-store">${o.store || '-'}</span></td>
                        <td style="font-size: 18px; font-weight: 700; color: #ffffff;">${o.description || '-'}</td>
                        <td>${o.grower || '-'}</td>
                        <td style="font-family: monospace; font-size: 17px; color: var(--accent); font-weight: 700;">${o.consignment || o.Consignment || '-'}</td>
                        <td style="font-weight: 700;">${o.size || '-'}</td>
                        <td><span class="badge-qty">${o.qty || '1'}</span></td>
                        <td>${commentBlock}</td>
                        <td style="font-size: 17px; font-weight: 700; color: #f43f5e;">${driverDisplay}</td>
                        <td><span class="status-pill ${statusLwr}">${o.status || 'new'}</span></td>
                    </tr>
                `;
            }).join('');

            document.getElementById('dashboard_tbody').innerHTML = html;

        } catch (err) {
            console.error('Dashboard reload exception:', err.message);
        }
    }

    fetchLiveOrders();
    setInterval(fetchLiveOrders, 4000);
</script>
</body>
</html>
