<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Dashboard - Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #2e7d32; color: white; }
        .urgent { background: #fff0f0; color: red; font-weight: bold; }
        .st-pending { color: orange; }
        .st-progress { color: blue; }
        .st-done { color: green; }
    </style>
</head>
<body>
    <h1 style="text-align:center">LIVE ORDER MONITOR</h1>
    <table>
        <thead>
            <tr><th>TIME</th><th>LINE</th><th>FRUIT/SORT</th><th>QTY</th><th>STORE</th><th>STATUS</th></tr>
        </thead>
        <tbody id="log_body"></tbody>
    </table>

<script>
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    const _db = supabase.createClient(supabaseUrl, supabaseKey);

    async function load() {
        const { data } = await _db.from('orders').select('*').order('id', {ascending:false}).limit(20);
        document.getElementById('log_body').innerHTML = data.map(o => `
            <tr class="${o.urgent ? 'urgent' : ''}">
                <td>${o.time}</td>
                <td><b>${o.line}</b></td>
                <td>${o.sort}</td>
                <td>${o.qty}</td>
                <td>${o.store}</td>
                <td><b class="st-${o.status}">${o.status.toUpperCase()}</b></td>
            </tr>
        `).join('');
    }

    load();
    setInterval(load, 5000);
</script>
</body>
</html>
