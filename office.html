<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Peake Fruit — Office Upload Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 40px; color: #1a1a2e; }
        .card { background: white; padding: 30px; border-radius: 8px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #0288d1; font-size: 24px; margin-top: 0; }
        .csv-box { border: 2px dashed #cbd5e0; padding: 30px; text-align: center; background: #f7fafc; border-radius: 6px; margin: 20px 0; }
        .btn { background: #0288d1; color: white; border: none; padding: 12px 20px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; }
        .btn:hover { background: #0277bd; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h1>Morning Stock Upload (Office)</h1>
    <p>Upload the morning CSV file to update available fruits, consignments, and locations for production lines.</p>
    
    <div class="csv-box">
        <input type="file" id="csv_file" accept=".csv">
    </div>
    
    <button class="btn" onclick="uploadMorningStock()">Clear Old & Upload New Stock</button>
    <div id="status"></div>
</div>

<script>
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    const _db = supabase.createClient(supabaseUrl, supabaseKey);

    async function uploadMorningStock() {
        const fileInput = document.getElementById('csv_file');
        const statusDiv = document.getElementById('status');
        
        if (!fileInput.files[0]) {
            alert("Please select a CSV file first!");
            return;
        }

        statusDiv.style.color = "orange";
        statusDiv.innerText = "Processing... Clearing old database...";

        try {
            // 1. Очищаем старую таблицу stock перед заливкой новой
            const { error: deleteError } = await _db.from('stock').delete().neq('id', 0);
            if (deleteError) throw deleteError;

            // 2. Читаем CSV
            const file = fileInput.files[0];
            const reader = new FileReader();
            
            reader.onload = async function(e) {
                const text = e.target.result;
                const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                
                // Пропускаем шапку, собираем массив строк
                const stockRows = [];
                for (let i = 1; i < lines.length; i++) {
                    const columns = lines[i].split(',');
                    stockRows.push({
                        description: columns[0] || null,
                        grower: columns[1] || null,
                        consignment: columns[2] || null,
                        origin: columns[3] || null,
                        size: columns[4] || null,
                        count: columns[5] || null,
                        available: columns[6] || null,
                        store: columns[7] || null
                    });
                }

                // 3. Загружаем пачкой в Supabase
                const { error: insertError } = await _db.from('stock').insert(stockRows);
                if (insertError) throw insertError;

                statusDiv.style.color = "green";
                statusDiv.innerText = `✅ Success! Loaded ${stockRows.length} items to Stock table.`;
                fileInput.value = '';
            };
            
            reader.readAsText(file);

        } catch (err) {
            statusDiv.style.color = "red";
            statusDiv.innerText = "Error: " + err.message;
        }
    }
</script>
</body>
</html>
