<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><title>Office - Stock Upload</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body{text-align:center;padding:50px;font-family:sans-serif;background:#f4f4f9}button{padding:20px;width:320px;margin:10px;cursor:pointer;border-radius:10px;border:none;font-weight:bold}</style>
</head>
<body>
    <h1>OFFICE PANEL</h1>
    <input type="file" id="csv" style="display:none" accept=".csv">
    <button style="background:#2e7d32;color:white" onclick="document.getElementById('csv').click()">UPLOAD STOCK (CSV: Sort, Qty, ST, Grower)</button><br>
    <button style="background:#d32f2f;color:white" onclick="resetOrders()">RESET ALL ORDERS</button><br>
    <button onclick="location.href='login.html'">Logout</button>

<script>
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    const _db = supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('csv').onchange = e => {
        Papa.parse(e.target.files[0], {
            header: false,
            complete: async (results) => {
                // Очищаем старые остатки
                await _db.from('stock').delete().neq('id', 0);
                
                // Формируем новые данные из CSV (Sort, Qty, ST, Grower)
                const newData = results.data.filter(r => r.length >= 4).map(r => ({
                    item_name: r[0],
                    quantity: r[1],
                    store: r[2],
                    grower: r[3]
                }));

                const { error } = await _db.from('stock').insert(newData);
                if(error) alert("Error: " + error.message);
                else alert("Stock Updated Successfully!");
            }
        });
    };

    async function resetOrders() {
        if(confirm("Delete all active orders?")) {
            await _db.from('orders').delete().neq('id', 0);
            alert("Orders cleared.");
        }
    }
</script>
</body>
</html>
