<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Excel Column Diagnostics</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #f4f6f9; color: #333; }
        .box { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        button { background: #0288d1; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #debug_output { 
            margin-top: 20px; padding: 15px; background: #fff3e0; 
            border-left: 5px solid #ff9800; border-radius: 4px; 
            font-family: monospace; white-space: pre-wrap; font-size: 14px; line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Peake Fruit — Шаг 1: Диагностика структуры файла</h2>
    <p>Выберите ваш утренний Excel файл, чтобы точно определить реальные буквы колонок:</p>
    <input type="file" id="diag_file" accept=".xlsx, .xls">
    <button onclick="runDiagnostics()">Запустить анализ колонок</button>
    
    <div id="debug_output">Здесь появится структура вашего файла...</div>
</div>

<script>
function runDiagnostics() {
    const fileInput = document.getElementById('diag_file');
    const output = document.getElementById('debug_output');
    
    if (!fileInput.files[0]) {
        alert("Пожалуйста, сначала выберите Excel файл!");
        return;
    }

    output.innerHTML = "⌛ Анализируем структуру листа...";
    const file = fileInput.files[0];
    const reader = new FileReader();
    
    reader.readAsBinaryString(file);
    reader.onload = function(e) {
        try {
            const bstr = e.target.result;
            const workbook = XLSX.read(bstr, { type: 'binary' });
            
            const sheetName = workbook.SheetNames.find(n => 
                n.toLowerCase().includes("stock") || n.toLowerCase().includes("daily")
            ) || workbook.SheetNames[0];
            
            const worksheet = workbook.Sheets[sheetName];
            const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: "A", defval: "" });
            
            if (rawRows.length === 0) {
                output.innerHTML = "Ошибка: Лист пустой.";
                return;
            }

            // Ищем строку заголовка
            let headerIndex = -1;
            for (let i = 0; i < Math.min(rawRows.length, 30); i++) {
                if (rawRows[i] && JSON.stringify(rawRows[i]).toLowerCase().includes('consignment')) {
                    headerIndex = i;
                    break;
                }
            }

            if (headerIndex === -1) {
                output.innerHTML = "❌ Ошибка: Не удалось найти строку со словом 'Consignment'.\n\nВот первые 5 строк файла для проверки:\n" + 
                    JSON.stringify(rawRows.slice(0, 5), null, 2);
                return;
            }

            // Берем строку заголовка и одну строку с реальными данными для примера
            const headerRow = rawRows[headerIndex];
            const subHeaderRow = rawRows[headerIndex + 1] || {};
            
            // Ищем первую попавшуюся строку с реальным товаром (где в А стоит число)
            let dataRow = null;
            for (let j = headerIndex + 2; j < rawRows.length; j++) {
                if (rawRows[j] && rawRows[j]["A"] && !isNaN(rawRows[j]["A"])) {
                    dataRow = rawRows[j];
                    break;
                }
            }
            if (!dataRow) dataRow = rawRows[headerIndex + 2] || {};

            let report = `📊 АНАЛИЗ КАРТЫ КОЛОНОК (Строка шапки №${headerIndex + 1}):\n`;
            report += `==================================================\n\n`;
            
            // Собираем все буквы колонок, которые есть в этой строке
            const letters = Object.keys(headerRow).sort((a,b) => a.localeCompare(b, undefined, {numeric: true}));
            
            letters.forEach(letter => {
                const headVal = String(headerRow[letter] || "").trim();
                const subHeadVal = String(subHeaderRow[letter] || "").trim();
                const exampleVal = String(dataRow[letter] || "").trim();
                
                let fullHeader = headVal;
                if (subHeadVal) fullHeader += " / " + subHeadVal;
                
                if (fullHeader || exampleVal) {
                    report += `Колонка [ ${letter} ]\n`;
                    report += `   Название в шапке: "${fullHeader || '(пусто)'}"\n`;
                    report += `   Пример значения:  "${exampleVal || '(пусто)'}"\n`;
                    report += `--------------------------------------------------\n`;
                }
            });

            output.innerHTML = report;

        } catch (err) {
            output.innerHTML = "❌ Критическая ошибка при разборе: " + err.message;
            console.error(err);
        }
    };
}
</script>

</body>
</html>
