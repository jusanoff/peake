<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Peake Fruit — Driver Terminal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #f8fafc; --card-bg: #ffffff; --text: #0f172a; --accent: #0288d1; }
        body { font-family: sans-serif; background: var(--bg); padding: 8px; }
        .container { max-width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .header { background: var(--card-bg); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .dashboard-card { background: var(--card-bg); padding: 12px; border-radius: 8px; border: 1px solid #edf2f7; }
        .btn-action { padding: 8px 14px; border: none; border-radius: 6px; color: white; font-weight: 700; cursor: pointer; width: 100%; }
        .btn-accept { background: #0288d1; }
        .btn-complete { background: #16a34a; }
        .btn-cancel { background: #dc2626; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px; border-bottom: 2px solid #e2e8f0; font-size: 12px; text-transform: uppercase; }
        td { padding: 10px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Driver Terminal</h1>
        <button onclick="localStorage.clear(); window.location.href='login.html';">Log Out</button>
    </div>

    <div class="dashboard-card">
        <h3>Active Orders</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th><th>Line</th><th>Store</th><th>Description</th><th>Action</th>
                </tr>
            </thead>
            <tbody id="driver_orders_body">
                <tr><td colspan="5">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    const clientDb = supabase.createClient(supabaseUrl, supabaseKey);
    const cachedDriverFullName = localStorage.getItem('name');

    async function loadAllOrders() {
        try {
            // 1. Загружаем заказы, исключая 'runner_request'
            const { data: orders, error } = await clientDb
                .from('orders')
                .select('*')
                .neq('order_type', 'runner_request') 
                .order('id', { ascending: false });

            if (error) throw error;

            // 2. Фильтруем: только новые ИЛИ свои активные ИЛИ свои завершенные сегодня
            const today = new Date().setHours(0,0,0,0);
            const filtered = orders.filter(o => {
                if (o.status === 'new') return true;
                if (o.driver_name === cachedDriverFullName) {
                    if (o.status === 'accepted') return true;
                    if (['delivered', 'cancelled'].includes(o.status)) {
                        return new Date(o.delivered_at || o.cancelled_at) >= today;
                    }
                }
                return false;
            });

            // 3. Вывод в таблицу
            document.getElementById('driver_orders_body').innerHTML = filtered.map(o => `
                <tr>
                    <td>#${o.id}</td>
                    <td>${o.line || '-'}</td>
                    <td>${o.store || '-'}</td>
                    <td>${o.description || '-'}</td>
                    <td>
                        ${o.status === 'new' ? `<button class="btn-action btn-accept" onclick="acceptOrder(${o.id})">Accept</button>` : ''}
                        ${o.status === 'accepted' ? `<button class="btn-action btn-complete" onclick="completeOrder(${o.id})">Complete</button>` : ''}
                    </td>
                </tr>
            `).join('');
        } catch (e) { console.error(e); }
    }

    async function acceptOrder(id) {
        await clientDb.from('orders').update({ status: 'accepted', driver_name: cachedDriverFullName }).eq('id', id);
        loadAllOrders();
    }

    async function completeOrder(id) {
        await clientDb.from('orders').update({ status: 'delivered', delivered_at: new Date().toISOString() }).eq('id', id);
        loadAllOrders();
    }

    loadAllOrders();
    setInterval(loadAllOrders, 5000);
</script>
</body>
</html>
