<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Driver Panel - Peake Fruit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p:#d32f2f; --s:#2e7d32; --bg:#f4f7f6; --w:#ff9800; }
        body{font-family:sans-serif; background:var(--bg); margin:0; padding:10px}
        .header{display:flex; justify-content:space-between; align-items:center; background:#fff; padding:10px; border-radius:12px; border-bottom:4px solid var(--p); margin-bottom:10px}
        .card{background:#fff; margin-bottom:10px; padding:15px; border-radius:12px; display:grid; grid-template-columns:1fr 110px; align-items:center; border-left:10px solid #ccc; box-shadow:0 2px 5px rgba(0,0,0,0.1)}
        .urgent{border:2px solid red !important; background:#fff0f0; animation:pulse 1.5s infinite}
        .btn{width:100%; padding:15px; border:none; border-radius:8px; color:#fff; font-weight:bold; cursor:pointer; text-transform:uppercase; font-size:13px}
        @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(211,47,47,0.4)} 70%{box-shadow:0 0 0 10px rgba(211,47,47,0)} 100%{box-shadow:0 0 0 0 rgba(211,47,47,0)}}
    </style>
</head>
<body>
    <div class="header">
        <b id="driver_name">DRIVER</b>
        <div id="clock" style="font-weight:bold; color:var(--p)">00:00</div>
    </div>
    <div id="orders_list">Загрузка заказов...</div>

<script>
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    const _db = supabase.createClient(supabaseUrl, supabaseKey);
    const myName = localStorage.getItem('user') || 'Driver';
    document.getElementById('driver_name').innerText = myName.toUpperCase();

    async function load() {
        const { data } = await _db.from('orders').select('*').neq('status', 'delivered').order('urgent', {ascending:false});
        const list = document.getElementById('orders_list');
        list.innerHTML = data.map(o => {
            let borderCol = o.status === 'in_progress' ? 'var(--s)' : '#ccc';
            return `
            <div class="card ${o.urgent ? 'urgent' : ''}" style="border-left-color:${borderCol}">
                <div>
                    <b style="font-size:18px">${o.line}</b> <small>${o.time}</small><br>
                    <span style="font-size:20px">${o.sort}</span> — <b>${o.qty}</b><br>
                    <span style="background:#eee; padding:2px 6px; border-radius:4px">📍 ${o.store}</span>
                </div>
                <div>
                    ${o.status === 'pending' 
                        ? `<button class="btn" style="background:var(--w)" onclick="upd(${o.id}, 'in_progress')">TAKE</button>` 
                        : `<button class="btn" style="background:var(--s)" onclick="upd(${o.id}, 'delivered', '${o.sort}', '${o.qty}')">DONE</button>`
                    }
                </div>
            </div>`;
        }).join('') || '<p style="text-align:center">No active orders</p>';
    }

    async function upd(id, st, sort, qty) {
        if (st === 'delivered') {
            // Списание со склада
            const { data: stockItem } = await _db.from('stock').select('*').eq('item_name', sort).maybeSingle();
            if (stockItem) {
                const newQty = Math.max(0, parseInt(stockItem.quantity) - parseInt(qty));
                await _db.from('stock').update({ quantity: newQty.toString() }).eq('id', stockItem.id);
            }
        }
        
        await _db.from('orders').update({ 
            status: st, 
            lockedBy: st === 'in_progress' ? myName : null 
        }).eq('id', id);
        
        load();
    }

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) }, 1000);
    load();
    setInterval(load, 5000);
</script>
</body>
</html>
