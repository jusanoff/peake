<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Peake Fruit — Driver Terminal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg: #111827;
            --card-bg: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #f43f5e;
            --border: #374151;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .header h1 { margin: 0; font-size: 18px; color: var(--accent); }

        .driver-badge {
            background: #fff1f2;
            color: #9f1239;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 13px;
        }

        .btn-logout {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .order-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .order-card.urgent {
            border-left: 5px solid #ef4444;
            background: linear-gradient(90deg, rgba(239,68,68,0.05) 0%, rgba(31,41,55,1) 100%);
        }

        .card-row { display: flex; justify-content: space-between; align-items: center; }
        .line-num { font-size: 20px; font-weight: 800; color: #fff; }
        .store-badge { background: #6b21a8; color: #fff; padding: 3px 8px; border-radius: 4px; font-weight: 700; }
        .qty-badge { background: #0369a1; color: #fff; padding: 3px 8px; border-radius: 4px; font-weight: 700; }
        
        .fruit-desc { font-size: 16px; font-weight: 700; color: #fff; margin: 5px 0; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 13px; color: var(--text-muted); }
        
        .logs-block {
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 6px;
            font-size: 13px;
            margin-top: 5px;
        }

        .driver-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-accept { background: #2563eb; color: white; }
        .btn-deliver { background: var(--success); color: white; }

        .driver-comment-box {
            display: flex;
            gap: 8px;
            margin-top: 5px;
            width: 100%;
        }
        .driver-comment-box input {
            flex: 1;
            padding: 8px;
            background: #111827;
            border: 1px solid var(--border);
            color: white;
            border-radius: 4px;
            font-size: 13px;
        }
        .btn-comment-send {
            background: #4b5563;
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .no-orders { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Peake Fruit — Driver Terminal</h1>
        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="driver-badge" id="driver_display">Driver: Loading...</div>
            <button class="btn-logout" onclick="localStorage.clear(); window.location.href='login.html';">Log Out</button>
        </div>
    </div>

    <div id="driver_orders_list">
        <div class="no-orders">Loading active pallet requests...</div>
    </div>
</div>

<script>
    const currentUser = localStorage.getItem('user');
    const currentRole = localStorage.getItem('role');

    if (!currentUser || currentRole !== 'driver') {
        alert("Access denied!");
        localStorage.clear();
        window.location.href = 'login.html';
    }

    document.getElementById('driver_display').innerText = '🚚 ' + currentUser;

    const k1 = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.';
    const k2 = 'eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.';
    const k3 = 'LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';

    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = k1 + k2 + k3;
    const clientDb = supabase.createClient(supabaseUrl, supabaseKey);

    function formatTime(isoString) {
        if (!isoString) return '-';
        const date = new Date(isoString);
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    async function loadDriverOrders() {
        try {
            // === ВОТ ЗДЕСЬ ЗАПОМИНАЕМ ТЕКСТ И КУРСОР ===
            const activeElement = document.activeElement;
            let focusedInputId = null;
            let savedValue = "";
            if (activeElement && activeElement.tagName === 'INPUT') {
                focusedInputId = activeElement.id;
                savedValue = activeElement.value;
            }

            const { data: orders, error } = await clientDb
                .from('orders')
                .select('*')
                .neq('status', 'delivered')
                .or(`driver_name.is.null,driver_name.eq."${currentUser}"`)
                .order('urgent', { ascending: false })
                .order('id', { ascending: false });

            if (error) throw error;

            if (!orders || orders.length === 0) {
                document.getElementById('driver_orders_list').innerHTML = `
                    <div class="no-orders">📭 No active tasks. All clear!</div>
                `;
                return;
            }

            let html = "";
            orders.forEach(o => {
                const isUrgent = o.urgent === true ? 'urgent' : '';
                const isMyJob = o.driver_name === currentUser;
                
                let logsHtml = `<div style="color:var(--text-main);">Line Note: ${o.comment || '-'}</div>`;
                if (o.office_comment) {
                    logsHtml += `<div style="color:#38bdf8; font-weight:600; margin-top:2px;">Office: ${o.office_comment}</div>`;
                }
                if (o.driver_comment) {
                    logsHtml += `<div style="color:#4ade80; font-weight:600; margin-top:2px;">Your Reply: ${o.driver_comment}</div>`;
                }

                let actionButtonHtml = "";
                if (!o.driver_name) {
                    actionButtonHtml = `<button class="btn-action btn-accept" onclick="acceptJob(${o.id})">🔗 Accept Job</button>`;
                } else if (isMyJob && o.status !== 'delivered') {
                    actionButtonHtml = `<button class="btn-action btn-deliver" onclick="completeJob(${o.id})">✅ Mark as Delivered</button>`;
                }

                let commentBoxHtml = "";
                if (isMyJob && !o.driver_comment) {
                    commentBoxHtml = `
                        <div class="driver-comment-box">
                            <input type="text" id="driver_msg_for_${o.id}" placeholder="Write a reply to line...">
                            <button class="btn-comment-send" onclick="sendDriverComment(${o.id})">Send</button>
                        </div>
                    `;
                }

                html += `
                    <div class="order-card ${isUrgent}">
                        <div class="card-row">
                            <span class="line-num">${o.line || 'Line ?'}</span>
                            <span style="font-size:12px; color:var(--text-muted);">⏱ ${formatTime(o.created_at)}</span>
                        </div>
                        <div class="fruit-desc">${o.description || 'No description'}</div>
                        
                        <div class="details-grid">
                            <div>Cons: <span style="color:#38bdf8; font-weight:700;">${o.consignment || o.Consignment || '-'}</span></div>
                            <div>Grower: <span>${o.grower || '-'}</span></div>
                            <div>Size: <span>${o.size || '-'}</span></div>
                            <div>Origin: <span>${o.origin || '-'}</span></div>
                        </div>

                        <div class="card-row" style="margin-top:5px;">
                            <div>Store: <span class="store-badge">${o.store || '-'}</span></div>
                            <div>Qty: <span class="qty-badge">${o.qty || '1'}</span></div>
                        </div>

                        <div class="logs-block">${logsHtml}</div>
                        ${commentBoxHtml}
                        ${actionButtonHtml ? `<div class="driver-actions">${actionButtonHtml}</div>` : ''}
                    </div>
                `;
            });

            // Твой оригинальный innerHTML
            document.getElementById('driver_orders_list').innerHTML = html;

            // === ВОТ ЗДЕСЬ ВОЗВРАЩАЕМ ВСЁ НА МЕСТО ПОСЛЕ ОБНОВЛЕНИЯ ===
            if (focusedInputId) {
                const inputEl = document.getElementById(focusedInputId);
                if (inputEl) {
                    inputEl.value = savedValue; // Возвращаем введенный текст
                    inputEl.focus();            // Возвращаем курсор
                }
            }

        } catch (err) {
            console.error("Driver fetch error:", err);
        }
    }

    async function acceptJob(orderId) {
        try {
            const { error } = await clientDb
                .from('orders')
                .update({ 
                    driver_name: currentUser,
                    status: 'accepted'
                })
                .eq('id', orderId);

            if (error) throw error;
            loadDriverOrders();
        } catch (e) { alert("Error accepting job: " + e.message); }
    }

    async function completeJob(orderId) {
        try {
            const { error } = await clientDb
                .from('orders')
                .update({ 
                    status: 'delivered',
                    delivered_at: new Date().toISOString()
                })
                .eq('id', orderId);

            if (error) throw error;
            loadDriverOrders();
        } catch (e) { alert("Error completing job: " + e.message); }
    }

    async function sendDriverComment(orderId) {
        const inputEl = document.getElementById(`driver_msg_for_${orderId}`);
        const text = inputEl ? inputEl.value.trim() : "";
        if (!text) return;

        try {
            const { error } = await clientDb
                .from('orders')
                .update({ driver_comment: text })
                .eq('id', orderId);

            if (error) throw error;
            loadDriverOrders();
        } catch (e) { alert("Error sending comment: " + e.message); }
    }

    loadDriverOrders();
    setInterval(loadDriverOrders, 4000);
</script>
</body>
</html>
