<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"><title>Панель Водителя - Peake Fruit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --p:#ef6c00; --s:#1a1a2e; --bg:#f0f2f5; --ok:#2e7d32; }
        body{font-family:sans-serif; background:var(--bg); margin:0; padding:10px;}
        .container{max-width:600px; margin:auto;}
        .driver-header { background:white; padding:15px; border-radius:10px; margin-bottom:15px; box-shadow:0 2px 5px rgba(0,0,0,0.05); display:flex; justify-content:space-between; align-items:center; }
        h3{margin:0; color:var(--s);}
        .order-card { background:white; padding:15px; border-radius:10px; margin-bottom:12px; box-shadow:0 3px 8px rgba(0,0,0,0.1); border-left:5px solid var(--p); position:relative; }
        .order-card.my-job { border-left-color: #1565c0; }
        .order-line { font-size:18px; font-weight:bold; color:#111; margin-bottom:5px; }
        .order-desc { font-size:14px; color:#555; margin-bottom:15px; }
        .btn-action { width:100%; padding:12px; font-size:14px; font-weight:bold; color:white; border:none; border-radius:6px; cursor:pointer; text-transform:uppercase; }
        .btn-take { background: var(--p); }
        .btn-done { background: var(--ok); }
        .btn-logout { background:#666; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-size:12px;}
        .empty-text { text-align:center; color:#888; margin-top:4px; font-size:14px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="driver-header">
            <div><small style="color:#666;">Водитель:</small> <br><h3 id="driver_name_display">Загрузка...</h3></div>
            <button class="btn-logout" onclick="logout()">Выйти</button>
        </div>

        <h4 style="margin:10px 5px; color:#555; text-transform:uppercase; font-size:12px;" id="title_block">Текущие задания</h4>
        <div id="driver_orders_container"></div>
    </div>

<script>
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    const _db = supabase.createClient(supabaseUrl, supabaseKey);

    const currentUser = localStorage.getItem('user');
    const currentRole = localStorage.getItem('role');
    const displayName = localStorage.getItem('name'); // Наше красивое реальное имя

    if (!currentUser || currentRole !== 'driver') {
        window.location.href = 'login.html';
    } else {
        document.getElementById('driver_name_display').innerText = displayName;
    }

    async function loadDriverOrders() {
        try {
            const { data: orders, error } = await _db.from('orders').select('*').order('id', { ascending: false });
            if (error) throw error;

            // Показываем водителю:
            // 1. Новые свободные заказы ('new'), у которых еще нет водителя
            // 2. Или заказы, которые уже назначены именно на это РЕАЛЬНОЕ ИМЯ ('process')
            const relevantOrders = orders.filter(o => o.status === 'new' || (o.status === 'process' && o.driver_name === displayName));
            const container = document.getElementById('driver_orders_container');

            if (relevantOrders.length === 0) {
                container.innerHTML = `<div class="empty-text">Нет активных заказов на данный момент</div>`;
                return;
            }

            container.innerHTML = relevantOrders.map(o => {
                const isMyJob = (o.status === 'process' && o.driver_name === displayName);
                
                let buttonHtml = '';
                if (!isMyJob) {
                    buttonHtml = `<button class="btn-action btn-take" onclick="takeOrder(${o.id})">Принять заказ (Взять)</button>`;
                } else {
                    buttonHtml = `<button class="btn-action btn-done" onclick="completeOrder(${o.id})">Выполнено (Завершить)</button>`;
                }

                return `
                <div class="order-card ${isMyJob ? 'my-job' : ''}">
                    <div class="order-line">${o.line || 'Линия'}</div>
                    <div class="order-desc">${o.description || 'Запрос материалов / поддонов'}</div>
                    ${buttonHtml}
                </div>`;
            }).join('');

        } catch (e) {
            console.error(e);
        }
    }

    // Функция: Водитель берёт свободный заказ сам
    async function takeOrder(orderId) {
        const { error } = await _db.from('orders')
            .update({ 
                status: 'process', 
                driver_name: displayName // Записываем красивое РЕАЛЬНОЕ ИМЯ
            })
            .eq('id', orderId);

        if (error) alert("Ошибка: " + error.message);
        loadDriverOrders();
    }

    // Функция: Водитель завершает заказ
    async function completeOrder(orderId) {
        const { error } = await _db.from('orders')
            .update({ 
                status: 'done',
                driver_name: displayName // Гарантируем сохранение реального имени в архиве
            })
            .eq('id', orderId);

        if (error) alert("Ошибка: " + error.message);
        loadDriverOrders();
    }

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }

    // Запуск панели и автообновление данных каждые 5 секунд
    loadDriverOrders();
    setInterval(loadDriverOrders, 5000);
</script>
</body>
</html>
