<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"><title>SuperAdmin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:sans-serif; padding:20px">
    <h2>Управление пользователями</h2>
    <div style="background:#f4f4f4; padding:15px; margin-bottom:20px">
        <input id="new_u" placeholder="Username">
        <input id="new_p" placeholder="Password">
        <select id="new_t">
            <option value="line">Line</option>
            <option value="office">Office</option>
            <option value="driver">Driver</option>
        </select>
        <button onclick="addUser()">ДОБАВИТЬ</button>
    </div>
    <table border="1" width="100%" style="border-collapse:collapse">
        <thead><tr><th>User</th><th>Password</th><th>Role</th><th>Action</th></tr></thead>
        <tbody id="user_list"></tbody>
    </table>

<script>
    const supabaseUrl = 'https://ndwipmobkqdvtaajqdez.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kd2lwbW9ia3FkdnRhYWpxZGV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3OTgxOTksImV4cCI6MjA5NDM3NDE5OX0.LJZyqxk7Zlezy7zQ4CRTUpzGwO1OQem7S9lMYt5pwnE';
    const _db = supabase.createClient(supabaseUrl, supabaseKey);

    async function load() {
        const { data } = await _db.from('app_users').select('*');
        document.getElementById('user_list').innerHTML = data.map(u => `
            <tr>
                <td>${u.username}</td>
                <td>${u.password}</td>
                <td>${u.role}</td>
                <td><button onclick="delUser(${u.id})">DEL</button></td>
            </tr>
        `).join('');
    }

    async function addUser() {
        const username = document.getElementById('new_u').value;
        const password = document.getElementById('new_p').value;
        const role = document.getElementById('new_t').value;
        await _db.from('app_users').insert([{ username, password, role }]);
        location.reload();
    }

    async function delUser(id) {
        if(confirm("Delete user?")) {
            await _db.from('app_users').delete().eq('id', id);
            load();
        }
    }

    load();
</script>
</body>
</html>
